name: Weekly update
on:
  schedule:
    - cron: "0 6 * * 2"      # Tuesdays 06:00 UTC, after the weekend's matches
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write             # lets the job commit results back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "print('pipeline will run here')"
