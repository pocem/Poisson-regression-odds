name: Update predictions & website

on:
  schedule:
    - cron: "0 6 * * *"     # daily: pick up new results, predict once every source has them
    - cron: "0 18 * * 2,5"  # Tue/Fri evening: bookmaker odds for the next round are posted
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/update-site.yml"

permissions:
  contents: write  # commit the updated data back
  pages: write
  id-token: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch tip, not the commit that triggered the run: runs queue one at a
          # time, so a queued run then starts from the data the previous run pushed.
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install -r requirements.txt

      - name: Predict next round
        id: predict
        # A crash in one league must not stop the others' data and the site
        # from being published -- the failure is reported in the last step.
        continue-on-error: true
        run: |
          set +e
          python src/live/predict_round.py --skip-if-unchanged
          code=$?
          if [ $code -eq 3 ]; then
            echo "::notice::Data sources haven't caught up with the latest results yet -- no new predictions this run."
            exit 0
          fi
          exit $code

      - name: Build website
        # Writes the AI round summary when the data changed (skipped without the secret).
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/site/build_site.py

      - name: Sync results to Supabase
        # Settles logged bets for the leaderboard (skipped without the secret). A failure
        # here mustn't stop the data commit or the deploy.
        continue-on-error: true
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python src/site/sync_results.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update predictions and data ($(date -u +%Y-%m-%d))"
            # Data files are regenerated every run, so on a clash keep this run's copy
            # ("theirs" is the commit being replayed during a rebase).
            git pull --rebase -X theirs
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: generated_site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Report a failed prediction step
        if: steps.predict.outcome == 'failure'
        run: |
          echo "::error::Predicting failed for at least one league (see the 'Predict next round' step). The site was still updated."
          exit 1
